[project]
name = "local-ai-support-assistant"
version = "0.1.0"
description = "Grounded local support Q&A with hybrid retrieval and a FastAPI interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "hypercorn>=0.16,<1",
    "openai>=1.30,<3",
]

[project.optional-dependencies]
hybrid = [
    "qdrant-client>=1.9,<2",
]

[tool.uv]
package = false
